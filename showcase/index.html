<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>選手大樓 成果展示</title>
<meta name="description" content="校園技能選手訓練大樓 BIM 專題：基地分析與 BIM 成本自動估算的互動展示">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebebe7; --bg-rgb:235,235,231; --ink:#1c1c1a; --ink-2:#4a4a46; --muted:#85857e; --line:#cfcfc8;
  --chip:#ffffffcc; --chip-line:#d6d6cf; --accent:#d9902b; --accent-soft:#f3dfbf; --green:#6f9a4c; --blue:#3f6fa8; --red:#c4553b;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --bg-rgb:22,24,27; --ink:#ecebe6; --ink-2:#c3c2bb; --muted:#8b8a84; --line:#34373c;
    --chip:#22252acc; --chip-line:#3a3d43; --accent:#f0aa45; --accent-soft:#4a3a22; --green:#8fbf68; --blue:#7aa6dd; --red:#e07a5f;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --bg-rgb:22,24,27; --ink:#ecebe6; --ink-2:#c3c2bb; --muted:#8b8a84; --line:#34373c;
  --chip:#22252acc; --chip-line:#3a3d43; --accent:#f0aa45; --accent-soft:#4a3a22; --green:#8fbf68; --blue:#7aa6dd; --red:#e07a5f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{font:500 12px/1.3 var(--sans);color:var(--ink);background:var(--chip);border:1px solid var(--chip-line);padding:3px 8px;border-radius:3px;white-space:nowrap;backdrop-filter:blur(4px);transition:opacity .4s}
.lbl.big{font-size:13px;padding:6px 10px;text-align:center}
.lbl.big b{display:block;font-size:15px}
.lbl.win{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lbl small{color:var(--muted);font-family:var(--mono);font-size:11px}
.lbl.dim{background:transparent;border:none;font-family:var(--mono);font-size:12px;color:var(--ink-2);backdrop-filter:none;text-shadow:0 0 4px rgba(var(--bg-rgb),.9)}

/* left fade + panel */
#fade{position:fixed;inset:0 auto 0 0;width:min(62vw,820px);pointer-events:none;
  background:linear-gradient(90deg,rgba(var(--bg-rgb),.97) 0%,rgba(var(--bg-rgb),.9) 45%,rgba(var(--bg-rgb),0) 100%)}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 40px 0 64px;pointer-events:none}
.brand{font-size:14px;letter-spacing:.04em;display:flex;flex-direction:column;gap:3px;pointer-events:auto;text-shadow:0 0 6px rgba(var(--bg-rgb),.9)}
.brand b{font-weight:700;font-size:15px}
.brand span{color:var(--ink-2);font-size:13.5px}
.ctrls{display:flex;gap:6px;pointer-events:auto}
.ctrls button{background:var(--chip);border:1px solid var(--chip-line);padding:7px 13px;font-size:13px;border-radius:3px;cursor:pointer;backdrop-filter:blur(4px)}
.ctrls button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ctrls button:hover{border-color:var(--ink-2)}

#panel{position:fixed;left:64px;top:104px;bottom:104px;width:min(460px,38vw);overflow-y:auto;scrollbar-width:none;padding-right:8px}
#panel::-webkit-scrollbar{display:none}
.slide{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.eyebrow .no{background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:2px}
h1{font-weight:300;font-size:clamp(44px,5.4vw,76px);line-height:1.12;margin:0 0 18px;letter-spacing:.02em}
h2{font-weight:300;font-size:clamp(32px,3.4vw,48px);line-height:1.18;margin:0 0 16px;letter-spacing:.02em}
.lead{font-size:15.5px;line-height:1.95;color:var(--ink);margin:0 0 6px}
.lead em{font-style:normal;color:var(--accent);font-weight:500}
.sub{font-size:14px;line-height:1.85;color:var(--ink-2);margin:0}
.rule{height:1px;background:var(--line);margin:22px 0}
.stats{display:flex;flex-wrap:wrap;gap:22px 40px}
.stat .v{font-family:var(--mono);font-size:clamp(30px,3vw,42px);line-height:1;letter-spacing:-.01em}
.stat .v small{font-size:13px;margin-left:3px;color:var(--ink-2)}
.stat .k{font-size:12.5px;color:var(--muted);margin-top:8px}
.stat.hl .v{color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.8}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--muted);margin-left:6px;vertical-align:2px}

/* bars */
.bars{display:grid;gap:12px;margin-top:4px}
.bar{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:12px;font-size:13px}
.bar .t{height:8px;background:var(--line);border-radius:1px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink-2);transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
.bar.hl .t i{background:var(--accent)}
.bar .n{font-family:var(--mono);text-align:right}
@keyframes grow{from{transform:scaleX(0)}}
/* table */
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--ink-2)}
table.cmp thead th{color:var(--muted);font-size:12px}
table.cmp td{font-family:var(--mono)}
table.cmp .win{color:var(--accent)}
/* flow */
.flow{display:grid;gap:0;margin-top:6px}
.flow .st{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.flow .st:before{content:"";position:absolute;left:13px;top:24px;bottom:0;width:1px;background:var(--line)}
.flow .st:last-child:before{display:none}
.flow .d{width:27px;height:27px;border:1px solid var(--ink-2);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--bg)}
.flow .st.hl .d{background:var(--accent);border-color:var(--accent);color:#fff}
.flow b{font-weight:500;font-size:14px}
.flow p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}
/* figures */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.figs.one{grid-template-columns:1fr}
figure{margin:0;cursor:zoom-in}
figure img{width:100%;display:block;border:1px solid var(--line);aspect-ratio:16/9;object-fit:cover;background:var(--line)}
figcaption{font-size:11.5px;color:var(--muted);margin-top:5px}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--ink);color:var(--bg);border:none;padding:11px 18px;font-size:14px;border-radius:3px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink-2)}
.qrs{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap}
.qr{display:grid;gap:6px;font-size:12px;color:var(--ink-2);text-align:center}
.qr div{background:#fff;padding:8px;border:1px solid var(--line);width:132px;height:132px}
.qr div img,.qr div svg{width:100%;height:100%;display:block}
.spark{width:100%;height:120px;display:block;overflow:visible}
.timechip{display:inline-block;font-family:var(--mono);font-size:13px;background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:2px;margin-left:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}

/* footer nav */
#foot{position:fixed;left:0;right:0;bottom:0;padding:0 40px 18px 64px;display:flex;align-items:flex-end;gap:24px}
#srcnote{position:fixed;left:64px;bottom:76px;font-size:11.5px;color:var(--muted)}
nav{flex:1;display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:64px;background:none;border:none;padding:14px 8px 4px 0;text-align:left;font-size:12px;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap}
nav button .n{font-family:var(--mono);margin-right:4px}
nav button.on{color:var(--ink)}
nav button:before{content:"";position:absolute;left:0;right:10px;top:-1px;height:2px;background:transparent}
nav button.on:before{background:var(--ink)}
nav button .pg{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:0}
.arrows{display:flex;gap:6px}
.arrows button{background:none;border:none;font-size:22px;padding:4px 8px;cursor:pointer;color:var(--ink)}
#compass{position:fixed;right:44px;bottom:84px;width:58px;height:58px;border:1px solid var(--line);border-radius:50%;background:var(--chip);display:grid;place-items:center}
#compass svg{width:40px;height:40px;transition:transform .1s linear}
#compass span{position:absolute;right:-12px;bottom:-4px;font:500 11px var(--mono);color:var(--ink-2)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:20;align-items:center;justify-content:center;padding:28px}
.ov.on{display:flex}
.ov img{max-width:100%;max-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.ov .x{position:absolute;top:14px;right:18px;background:#fff;color:#111;border:none;border-radius:3px;padding:6px 12px;cursor:pointer;font-size:14px}
.ov .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#eee;font-size:13px}
#dash iframe{width:min(1400px,100%);height:100%;border:none;background:#0f172a;border-radius:4px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted);pointer-events:none;transition:opacity .6s}

@media (max-width: 900px), (orientation: portrait) and (max-width: 1100px){
  #fade{width:100%;top:auto;height:62vh;background:linear-gradient(0deg,rgba(var(--bg-rgb),.98) 0%,rgba(var(--bg-rgb),.94) 70%,rgba(var(--bg-rgb),0) 100%)}
  header{padding:14px 16px 0}
  .brand b{font-size:13px} .brand span{font-size:11.5px}
  .ctrls button{padding:6px 9px;font-size:12px}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:86px;max-height:52vh}
  h1{font-size:40px} h2{font-size:28px}
  .lead{font-size:14.5px;line-height:1.8}
  #foot{padding:0 8px 10px 16px;gap:8px}
  #srcnote{display:none}
  #compass{right:16px;bottom:auto;top:64px;width:46px;height:46px}
  #compass svg{width:32px;height:32px}
  nav button{min-width:auto;padding-right:14px}
  nav button .t{display:none}
  nav button.on .t{display:inline}
  .bar{grid-template-columns:110px 1fr 48px}
  .stats{gap:16px 28px}
}
@media (max-width: 480px){
  .ctrls button.opt{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="fade"></div>
<div id="loading">載入模型中…</div>

<header>
  <div class="brand"><b>臺北市立南港高級工業職業學校</b><span>BIM 實作：建模、整合與資訊應用成果展</span></div>
  <div class="ctrls">
    <button id="bAuto" aria-pressed="false">自動播放</button>
    <button id="bSound" class="opt" aria-pressed="false">音效 關</button>
    <button id="bTheme">明暗</button>
    <button id="bFull" class="opt">全螢幕</button>
  </div>
</header>

<main id="panel" aria-live="polite"></main>
<div id="srcnote"></div>
<div id="compass" title="指北"><svg viewBox="-20 -20 40 40"><path d="M0-17 6 4 0 0-6 4Z" fill="currentColor"/><path d="M0 17 6 4 0 0-6 4Z" fill="none" stroke="currentColor" stroke-width="1"/></svg><span>N</span></div>

<div id="foot">
  <nav id="nav"></nav>
  <div class="arrows"><button id="bPrev" aria-label="上一章">←</button><button id="bNext" aria-label="下一章">→</button></div>
</div>

<div class="ov" id="lightbox"><button class="x">關閉</button><img alt=""><div class="cap"></div></div>
<div class="ov" id="dash"><button class="x">關閉儀表板</button><iframe title="BIM 成本儀表板" loading="lazy"></iframe></div>

<script src="vendor/qrcode.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './vendor/CSS2DRenderer.js';

/* ---------- 可調整的文字 ---------- */
const TITLE_SUB = '夜燈不滅：為晚歸選手而生的 BIM 訓練大樓設計';
const DASH_URL = '../#project=builtin';
const SITE_URL = 'https://nkhs-arch.github.io/bim-concrete-cost/';
const SHOW_URL = 'https://nkhs-arch.github.io/bim-concrete-cost/showcase/';

/* ---------- 資料 ---------- */
const [g3, D] = await Promise.all([
  fetch('g3_data.json').then(r => r.json()),
  fetch('../data.json').then(r => r.json()).catch(() => null)
]);
const LV = Object.fromEntries(g3.levels);           // {1F:0,2F:5.8,...}
const LV_NAMES = g3.levels.map(l => l[0]);
const H = LV.RF;
const ringArea = r => Math.abs(r.reduce((s, p, i) => { const q = r[(i + 1) % r.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0) / 2);
const GFA = {}; let GREEN = 0;
for (const [lv, arr] of Object.entries(g3.slabs)) for (const s of arr) {
  if (s.t.includes('綠屋頂')) { GREEN += ringArea(s.poly[0]); continue; }
  if (lv !== 'RF') GFA[lv] = (GFA[lv] || 0) + ringArea(s.poly[0]);
}
const GFA_TOTAL = Object.values(GFA).reduce((a, b) => a + b, 0);

const fmt = (n, d = 0) => Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const wan = n => fmt(n / 1e4, 1);
// 成本資料（data.json；讀不到時用 2026-11-26 的數字）
const V = D ? D.versions[D.versions.length - 1] : { version: 'V2', total_volume: 4326.77, cost_at_current_price: 14036042, carbon_tco2e: 1462.4, elements: { floors: { volume: 2117.16 }, columns: { volume: 660.13 }, beams: { volume: 1549.48 } } };
const VERS = D ? D.versions : [{ version: 'V1', total_volume: 4463.52, cost_at_current_price: 14479659, carbon_tco2e: 1508.7 }, V];
const R = D ? D.rebar : { gross_weight_t: 591.9, price: 20202, cost: 11957321, total_cost: 25993363, carbon: { tco2e: 493.6, factor: 0.834 } };
const PRICE280 = D ? D.prices['280'] : 3244;
const PRICE_MONTH = D ? D.price_month : '2026-10';
const HIST = D ? D.cost_history : [];
const CF280 = D ? D.carbon_factors['280'].factor : 338;

/* ---------- three.js 場景 ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer({ element: document.getElementById('labels') });

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xebebe7, 700, 1500);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
window._v = { camera, controls };
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 25; controls.maxDistance = 1300;
controls.enablePan = false;

const hemi = new THREE.HemisphereLight(0xffffff, 0xcfcfc6, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 1, far: 600 });
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// 座標：資料 x 往東、y 往南 → three X=x-30, Z=y-15（北 = -Z）
const OX = 30, OY = 15;
const P = (x, y) => [x - OX, y - OY];

const M = {
  ground: new THREE.MeshLambertMaterial({ color: 0xe4e4df }),
  garden: new THREE.MeshLambertMaterial({ color: 0xd3dcc6, transparent: true, opacity: 0.55 }),
  road: new THREE.MeshLambertMaterial({ color: 0xd2d2cc }),
  ctx: new THREE.MeshLambertMaterial({ color: 0xf4f4f1 }),
  slab: new THREE.MeshLambertMaterial({ color: 0xf7f7f4 }),
  ext: new THREE.MeshLambertMaterial({ color: 0xf2f2ee, transparent: true, opacity: 1 }),
  int: new THREE.MeshLambertMaterial({ color: 0xe9e9e4, transparent: true, opacity: 1 }),
  win: new THREE.MeshLambertMaterial({ color: 0x9fb3bf, emissive: 0x000000 }),
  green: new THREE.MeshLambertMaterial({ color: 0x8fb46a }),
  leaf: new THREE.MeshLambertMaterial({ color: 0x86ad5c }),
  trunk: new THREE.MeshLambertMaterial({ color: 0x8a7a66 }),
  pv: new THREE.MeshLambertMaterial({ color: 0x2f4a6d }),
  frc: new THREE.MeshBasicMaterial({ color: 0xd9902b, transparent: true, opacity: 0.18, depthWrite: false }),
  edge: new THREE.LineBasicMaterial({ color: 0x55554f, transparent: true, opacity: 0.55 }),
  ctxEdge: new THREE.LineBasicMaterial({ color: 0x9a9a92, transparent: true, opacity: 0.45 }),
  dash: new THREE.LineDashedMaterial({ color: 0xd9902b, dashSize: 1.2, gapSize: 0.8 }),
  mass: new THREE.MeshLambertMaterial({ color: 0xf4f4f1 }),
  massG3: new THREE.MeshLambertMaterial({ color: 0xf4f4f1 }),
};

function addEdges(mesh, mat = M.edge) {
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 25), mat);
  e.position.copy(mesh.position); e.rotation.copy(mesh.rotation); e.scale.copy(mesh.scale);
  mesh.parent.add(e); mesh.userData.edges = e; return e;
}
function boxAt(parent, x0, y0, x1, y1, z0, z1, mat, edgeMat = M.edge) {
  const [ax, az] = P(Math.min(x0, x1), Math.min(y0, y1)), [bx, bz] = P(Math.max(x0, x1), Math.max(y0, y1));
  const m = new THREE.Mesh(new THREE.BoxGeometry(bx - ax, z1 - z0, bz - az), mat);
  m.position.set((ax + bx) / 2, (z0 + z1) / 2, (az + bz) / 2);
  m.castShadow = m.receiveShadow = true; parent.add(m);
  if (edgeMat) addEdges(m, edgeMat);
  return m;
}

/* 地面、周邊建物、道路與綠地（OpenStreetMap） */
// 基地在校園座標中的位置：模具工場與機械、水電工場之間的綠地（使用者 2026-11-27 確認）。
// 建築西北角在南港高工中心往西 149.6 m、往北 65.4 m，校舍軸線較正北偏約 12°。
const SITE = { nwX: -149.6, nwY: -65.4, rot: 0.2075 };
const CU = [Math.cos(SITE.rot), -Math.sin(SITE.rot)], CV = [Math.sin(SITE.rot), Math.cos(SITE.rot)]; // 建築 x、y 軸在校園座標的方向
const EAST = new THREE.Vector3(CU[0], 0, CV[0]), NORTH = new THREE.Vector3(-CU[1], 0, -CV[1]);
const world = new THREE.Group(); scene.add(world);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), M.ground);
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.3; ground.receiveShadow = true; ground.renderOrder = -10; world.add(ground);
function flat(parent, x0, y0, x1, y1, mat, h = 0.02) {
  const [ax, az] = P(x0, y0), [bx, bz] = P(x1, y1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(bx - ax, bz - az), mat);
  m.rotation.x = -Math.PI / 2; m.position.set((ax + bx) / 2, h, (az + bz) / 2); m.receiveShadow = true; parent.add(m); return m;

function camPose(az, el, dist, tx = 0, ty = 6, tz = 0) {
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  const narrow = innerWidth < 900 || innerHeight > innerWidth;
  const d = dist * (narrow ? 1.45 : 1);
  // 旋轉中心固定在建築上；讓出文字區改用 setViewOffset 平移畫面（見 resize）
  const tt = new THREE.Vector3(tx, ty, tz);
  return { pos: new THREE.Vector3(tt.x + d * Math.sin(a) * Math.cos(e), tt.y + d * Math.sin(e), tt.z + d * Math.cos(a) * Math.cos(e)), tgt: tt };
}
let camAnim = null;

function sparkSVG() {
  if (!HIST.length) return '';
  const vs = HIST.map(h => h.cost), mn = Math.min(...vs), mx = Math.max(...vs), W = 440, Hh = 110;
  const xy = vs.map((v, i) => [i / (vs.length - 1) * W, 10 + (1 - (v - mn) / (mx - mn || 1)) * (Hh - 30)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh + 10}" preserveAspectRatio="none" role="img" aria-label="近 12 個月混凝土成本走勢">
    <path d="${d} L ${W} ${Hh} L 0 ${Hh} Z" fill="var(--accent-soft)" opacity=".7"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/>
    <text x="0" y="${Hh + 10}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono">${HIST[0].month}</text>
    <text x="${W}" y="${Hh + 10}" font-size="11" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono">${HIST[HIST.length - 1].month}</text>
    <text x="0" y="10" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono">${wan(mx)} 萬</text>
  </svg>`;
}

    <table class="cmp"><thead><tr><th></th>${VERS.map(v => `<th>${v.version}</th>`).join('')}<th>增減</th></tr></thead><tbody>
      <tr><td>混凝土（m³）</td>${VERS.map(v => `<td>${fmt(v.total_volume)}</td>`).join('')}<td class="win">${fmt(VERS.at(-1).total_volume - VERS[0].total_volume)}</td></tr>
      <tr><td>成本（萬）</td>${VERS.map(v => `<td>${wan(v.cost_at_current_price)}</td>`).join('')}<td class="win">${wan(VERS.at(-1).cost_at_current_price - VERS[0].cost_at_current_price)}</td></tr>
      <tr><td>碳排（t）</td>${VERS.map(v => `<td>${fmt(v.carbon_tco2e)}</td>`).join('')}<td class="win">${fmt(VERS.at(-1).carbon_tco2e - VERS[0].carbon_tco2e)}</td></tr>
    </tbody></table>
    <p class="note">資料來源：結構練習模型各版本 Revit 明細表，以目前單價重算。</p>` },

  { k: '現場試算', cam: [-20, 40, 460, 0, 0, 0], rot: true, sets: [], dur: 20, html: () => `
    ${eb(16, '動手試試看')}
    <h2>掃 QR code，<br>自己操作成本網站</h2>
    <p class="lead">放入新的 Revit 明細表或 Forma 匯出 Excel，網站會用最新單價<em>當場重算</em>成本、鋼筋與碳排，也能依樓層或構件分區。</p>
    <button class="btn" id="openDash">開啟成本儀表板 →</button>
    <div class="qrs">
      <div class="qr"><div id="qr1"></div>成本儀表板</div>
      <div class="qr"><div id="qr2"></div>這個展示網頁</div>
    </div>
    <p class="note">參考資料：地圖 © OpenStreetMap 貢獻者（ODbL）；分析 Autodesk Forma；三維引擎 three.js（MIT 授權）；成本網站原始碼 github.com/nkhs-arch/bim-concrete-cost。</p>` },
];

/* ---------- 導覽 ---------- */
const nav = document.getElementById('nav'), panel = document.getElementById('panel');
CH.forEach((c, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="n">${String(i).padStart(2, '0')}</span><span class="t">${c.k}</span><span class="pg"></span>`;
  b.onclick = () => { go(i); poke(); }; nav.appendChild(b);
});
document.getElementById('srcnote').textContent = `模型：G3 量體（Dynamo 自動建模）｜地圖 © OpenStreetMap 貢獻者｜成本：結構練習模型 ${V.version}，${PRICE_MONTH} 單價`;

let cur = -1, bldAlpha = 1, bldTarget = 1, explodeT = 0, explodeTarget = 0, sunAnim = null, sunHour = 6;
function setOpacity(mats, o) { for (const m of mats) { m.transparent = o < 1; m.opacity = o; m.depthWrite = o >= 1; } }
function go(i) {
  i = (i + CH.length) % CH.length; if (i === cur) return; cur = i;
  const c = CH[i];
  panel.innerHTML = `<div class="slide">${c.html()}</div>`; panel.scrollTop = 0;
  [...nav.children].forEach((b, j) => b.classList.toggle('on', j === i));
  nav.children[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  try { history.replaceState(null, '', '#' + i); } catch { }
  // 場景狀態
  forceNight = !!c.night; root.dataset.theme = forceNight ? 'dark' : theme; applyPalette();
  bldTarget = c.bld ?? 1;
  explodeTarget = c.explode ? 1 : 0;
  cmp.visible = !!c.compare; ctx.visible = southF.visible = !c.compare && !c.xray; trees.visible = !c.compare; gardenGrp.visible = !!c.heat;
  wind.visible = !!c.wind; pvGrp.visible = !!c.pv;
  outline.visible = !!c.dims || c.bld === 0; dimLines.visible = !!c.dims;
  frcGrp.visible = false;
  setOpacity([M.ext, M.win], c.xray ? 0.16 : 1); setOpacity([M.int], c.xray ? 0.5 : 1);
  M.slab.color.set(c.slabHL ? (theme === 'dark' ? 0x8a6a3a : 0xf0c88a) : PAL[(theme === 'dark' || forceNight) ? 'dark' : 'light'].slab);
  M.garden.color.set(c.heat ? (theme === 'dark' ? 0x5a3a22 : 0xf1c79a) : PAL[(theme === 'dark' || forceNight) ? 'dark' : 'light'].garden);
  for (const l of labels) l.o.visible = c.sets.some(s => l.sets.has(s)) && !(l.sets.has('nomass') && c.bld !== 0 && !l.sets.has('site'));
  if (c.sunAnim !== undefined) { buildSunPath(c.sunAnim); sunPath.visible = true; sunAnim = c.sunAnim; sunHour = 6; }
  else { sunPath.visible = false; sunAnim = null; setSun(DEFAULT_SUN); }
  const [az, el, dist, tx, ty, tz] = c.cam; flyTo(camPose(az, el, dist, tx ?? 0, ty ?? 6, tz ?? 0));
  rotating = !!c.rot;
  // 互動元件
  panel.querySelectorAll('figure').forEach(f => f.onclick = () => openLB(f.dataset.src, f.dataset.cap));
  const od = panel.querySelector('#openDash'); if (od) od.onclick = openDash;
  if (panel.querySelector('#qr1')) { drawQR('qr1', SITE_URL + '#project=builtin'); drawQR('qr2', SHOW_URL); }
  blip(); startTimer();
}
function setSun(v) { sun.position.copy(v).multiplyScalar(260); sun.target.position.set(0, 0, 0); }
function drawQR(id, text) {
  if (typeof qrcode !== 'function') return;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  document.getElementById(id).innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

/* lightbox / 儀表板 */
const lb = document.getElementById('lightbox'), dash = document.getElementById('dash');
function openLB(src, cap) { lb.querySelector('img').src = src; lb.querySelector('.cap').textContent = cap; lb.classList.add('on'); pauseAuto(); }
function openDash() { const f = dash.querySelector('iframe'); if (!f.src) f.src = DASH_URL; dash.classList.add('on'); pauseAuto(); }
for (const o of [lb, dash]) { o.querySelector('.x').onclick = () => o.classList.remove('on'); o.addEventListener('click', e => { if (e.target === o) o.classList.remove('on'); }); }

/* ---------- 自動播放、閒置、音效 ---------- */
const bAuto = document.getElementById('bAuto'), bSound = document.getElementById('bSound');
let auto = false, timer = null, tStart = 0, idleT = null, soundOn = false, actx = null, rotating = false;
const IDLE_MS = 60000;
function durOf(i) { return (CH[i].dur || 12) * 1000; }
function startTimer() { clearTimeout(timer); tStart = performance.now(); if (auto) timer = setTimeout(() => go(cur + 1), durOf(cur)); }
function setAuto(on) { auto = on; bAuto.setAttribute('aria-pressed', on); bAuto.textContent = on ? '自動播放 中' : '自動播放'; startTimer(); }
function pauseAuto() { if (auto) setAuto(false); }
bAuto.onclick = () => { setAuto(!auto); };
function poke() { clearTimeout(idleT); idleT = setTimeout(() => { if (!auto && !lb.classList.contains('on') && !dash.classList.contains('on')) { go(0); setAuto(true); } }, IDLE_MS); if (auto) startTimer(); }
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(e => addEventListener(e, poke, { passive: true }));
bSound.onclick = () => { soundOn = !soundOn; bSound.setAttribute('aria-pressed', soundOn); bSound.textContent = soundOn ? '音效 開' : '音效 關'; if (soundOn) { actx = actx || new AudioContext(); blip(); } };
function blip() {
  if (!soundOn || !actx) return;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = 660;
  o.frequency.exponentialRampToValueAtTime(990, actx.currentTime + 0.08);
  g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.08, actx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.3);
}
document.getElementById('bTheme').onclick = () => { setTheme(theme === 'dark' ? 'light' : 'dark'); const c = cur; cur = -1; go(c); };
const bFull = document.getElementById('bFull');
bFull.onclick = toggleFull;
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
document.getElementById('bPrev').onclick = () => go(cur - 1);
document.getElementById('bNext').onclick = () => go(cur + 1);
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'Escape') { lb.classList.remove('on'); dash.classList.remove('on'); return; }
  if (dash.classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'f' || e.key === 'F') toggleFull();
});
// 在文字區左右滑動換章（觸控）
let sx = null, sy = null;
panel.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1)); sx = null; }, { passive: true });
controls.addEventListener('start', () => { rotating = false; camAnim = null; });

/* ---------- 迴圈 ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); labelR.setSize(w, h); camera.aspect = w / h;
  const narrow = w < 900 || h > w; // 桌機：畫面往右移讓出左邊文字區；直式：往上移讓出下方文字
  camera.setViewOffset(w, h, narrow ? 0 : -w * 0.2, narrow ? h * 0.27 : 0, w, h); camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); const c = CH[cur]; if (c) { const [az, el, dist, tx, ty, tz] = c.cam; flyTo(camPose(az, el, dist, tx ?? 0, ty ?? 6, tz ?? 0), 600); } });
resize();
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const compass = document.querySelector('#compass svg');
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (camAnim) {
    const k = Math.min(1, (now - camAnim.s) / camAnim.dur), e = ease(k);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (k >= 1) camAnim = null;
  } else if (rotating) {
    const t = controls.target, off = camera.position.clone().sub(t); off.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.05); camera.position.copy(t).add(off);
  }
  controls.update();
  // 量體淡入淡出、樓層拆開
  bldAlpha += (bldTarget - bldAlpha) * Math.min(1, dt * 4);
  bld.visible = bldAlpha > 0.02;
  const solid = bldAlpha > 0.97;
  for (const m of [M.slab, M.green, M.leaf]) { m.transparent = !solid; m.opacity = bldAlpha; }
  if (!CH[cur]?.xray) { M.ext.transparent = M.win.transparent = M.int.transparent = !solid; M.ext.opacity = M.win.opacity = M.int.opacity = bldAlpha; M.ext.depthWrite = solid; }
  M.edge.opacity = 0.55 * bldAlpha;
  explodeT += (explodeTarget - explodeT) * Math.min(1, dt * 3);
  storeys.forEach((g, i) => g.position.y = explodeT * i * 5);
  pvGrp.position.y = explodeT * 4 * 5;
  // 太陽
  if (sunAnim !== null) {
    sunHour += dt * 1.1; if (sunHour > 18.5) sunHour = 5.5;
    const s = sunDir(sunAnim, sunHour);
    if (s.alt > 0.02) { setSun(s.v); sunBall.position.copy(s.v).multiplyScalar(120); sunBall.visible = true; sun.intensity = PAL[theme === 'dark' ? 'dark' : 'light'].sun * Math.min(1, s.alt * 4) + 0.1; }
    else sunBall.visible = false;
    const ck = document.getElementById('clock'); if (ck) { const h = Math.floor(sunHour), m = Math.floor((sunHour - h) * 60); ck.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }
  }
  if (wind.visible) stepWind(dt);
  // 指北針
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  compass.style.transform = `rotate(${(az + SITE.rot) * 180 / Math.PI}deg)`;
  // 自動播放進度
  if (auto && nav.children[cur]) nav.children[cur].querySelector('.pg').style.width = Math.min(100, (now - tStart) / durOf(cur) * 100) + '%';
  [...nav.children].forEach((b, j) => { if (j !== cur || !auto) b.querySelector('.pg').style.width = '0'; });
  renderer.render(scene, camera); labelR.render(scene, camera);
  requestAnimationFrame(loop);
}
const start = parseInt(location.hash.slice(1));
const p0 = camPose(-60, 55, 900, 0, 0, 0); camera.position.copy(p0.pos); controls.target.copy(p0.tgt);
go(Number.isFinite(start) ? start : 0);
document.getElementById('loading').remove();
poke();
requestAnimationFrame(loop);
</script>
</body>
